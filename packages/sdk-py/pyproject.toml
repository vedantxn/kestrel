[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kestrel-browser"
version = "1.0.0"
description = "Python client for Kestrel, open-source cloud browsers for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["browser", "chrome", "cdp", "playwright", "ai-agents", "self-hosted"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/vedantxn/kestrel"
Documentation = "https://github.com/vedantxn/kestrel/tree/main/docs/agents"
Issues = "https://github.com/vedantxn/kestrel/issues"

[project.optional-dependencies]
# `connect()` attaches Playwright to a new session.
playwright = ["playwright>=1.40"]
dev = ["pytest>=8", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
# Imported as `kestrel_browser`: the names `kestrel` and `kestrel-sdk` belong to unrelated PyPI projects.
packages = ["src/kestrel_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
