<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>plain</title>
    <script>
      (function () {
        var base = document.title;
        window.ok = function () {
          window.solved = 1;
        };
        setInterval(function () {
          document.title =
            base +
            " wd=" +
            navigator.webdriver +
            (window.solved ? " solved" : "");
        }, 250);
      })();
    </script>
  </head>
  <body style="margin: 0; font: 16px sans-serif">
    <!-- Official test keys: they always pass, and are for testing only. -->

      <p>No CAPTCHA here.</p>
    </div>
  </body>
</html>
